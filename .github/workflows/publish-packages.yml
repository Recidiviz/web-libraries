name: Publish tagged packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-eslint-config:
    name: Publish eslint-config package
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/eslint-config@') }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/eslint-config
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - name: Use Node 14
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
        with:
          node-version: 14.x
          registry-url: https://registry.npmjs.org
          scope: "@recidiviz"
      - name: Yarn install with cache
        uses: bahmutov/npm-install@6bbff949458c1dd99b20e185cee8c4d6fcf1212a # v1.10.9
        with:
          working-directory: packages/eslint-config
          install-command: yarn --frozen-lockfile
      # npm trusted publishing (OIDC) needs npm 11.5.1 or later.
      - name: Use Node 24 for publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          scope: "@recidiviz"
      - name: Update npm
        run: npm install -g npm@latest
      - name: Publish
        run: npm publish --verbose --provenance --access public
  publish-tsconfig:
    name: Publish tsconfig package
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/tsconfig@') }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/tsconfig
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - name: Use Node 14
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
        with:
          node-version: 14.x
          registry-url: https://registry.npmjs.org
          scope: "@recidiviz"
      # npm trusted publishing (OIDC) needs npm 11.5.1 or later.
      - name: Use Node 24 for publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          scope: "@recidiviz"
      - name: Update npm
        run: npm install -g npm@latest
      - name: Publish
        run: npm publish --verbose --provenance --access public
  publish-design-system:
    name: Publish design-system package
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/design-system@') }}
    permissions:
      # The Storybook deploy pushes to the gh-pages branch.
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: packages/design-system
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - name: Use Node 14
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
        with:
          node-version: 14.x
          registry-url: https://registry.npmjs.org
          scope: "@recidiviz"
      - name: Yarn install with cache
        uses: bahmutov/npm-install@6bbff949458c1dd99b20e185cee8c4d6fcf1212a # v1.10.9
        with:
          working-directory: packages/design-system
          install-command: yarn --frozen-lockfile
      - name: Yarn build
        run: yarn build
      # npm trusted publishing (OIDC) needs npm 11.5.1 or later.
      - name: Use Node 24 for publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          scope: "@recidiviz"
      - name: Update npm
        run: npm install -g npm@latest
      - name: Publish
        run: npm publish --verbose --provenance --access public
      - name: Deploy Storybook
        run: yarn run deploy-storybook
        env:
          GH_TOKEN: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
          # Storybook 6 uses webpack 4, which needs the legacy OpenSSL provider on Node 17+.
          NODE_OPTIONS: --openssl-legacy-provider
  publish-auth:
    name: Publish auth package
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/auth@') }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/auth
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - name: Use Node 14
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
        with:
          node-version: 14.x
          registry-url: https://registry.npmjs.org
          scope: "@recidiviz"
      - name: Yarn install with cache
        uses: bahmutov/npm-install@6bbff949458c1dd99b20e185cee8c4d6fcf1212a # v1.10.9
        with:
          working-directory: packages/auth
          install-command: yarn --frozen-lockfile
      - name: Yarn build
        run: yarn build
      # npm trusted publishing (OIDC) needs npm 11.5.1 or later.
      - name: Use Node 24 for publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          scope: "@recidiviz"
      - name: Update npm
        run: npm install -g npm@latest
      - name: Publish
        run: npm publish --verbose --provenance --access public
